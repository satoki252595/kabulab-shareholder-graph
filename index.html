<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>持合い — 直近有報の株主グラフ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>持合い</h1>
      <p id="lede">直近の有価証券報告書から読んだ大株主です。</p>
    </div>
    <form class="search" role="search" id="search-form">
      <label class="sr" for="q">銘柄コードか社名</label>
      <input id="q" type="search" placeholder="コードか社名" autocomplete="off" spellcheck="false">
      <ul id="suggest" class="suggest" hidden></ul>
    </form>
  </header>

  <div class="modes" role="tablist">
    <button type="button" class="mode" data-mode="ego" aria-selected="true">この銘柄</button>
    <button type="button" class="mode" data-mode="mutual" aria-selected="false">相互持合い</button>
    <button type="button" class="mode" data-mode="all" aria-selected="false">全体</button>
  </div>

  <main>
    <aside class="lists" aria-label="銘柄リスト">
      <section>
        <h2>株主ハブ</h2>
        <ol id="hubs"></ol>
      </section>
      <section>
        <h2>事業会社の比率が下がった銘柄</h2>
        <ol id="drops"></ol>
      </section>
      <section>
        <h2>相互に持ち合う組</h2>
        <ol id="pairs"></ol>
      </section>
    </aside>

    <section class="stage" aria-label="株主グラフ">
      <canvas id="graph"></canvas>
      <p id="graph-note" class="note"></p>
      <div class="legend" aria-hidden="true">
        <span><i class="swatch corp"></i>事業会社</span>
        <span><i class="swatch inst"></i>機関</span>
        <span><i class="swatch stable"></i>個人・持株会・保険</span>
        <span><i class="swatch broker"></i>証券</span>
      </div>
    </section>

    <aside class="detail" id="detail" aria-live="polite">
      <p class="quiet">銘柄を選ぶと、大株主と保有先が出ます。</p>
    </aside>
  </main>

  <footer>
    <p id="foot"></p>
  </footer>
  <script src="assets/app.js"></script>
</body>
</html>
