<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>持合い — 直近有報の株主グラフ</title>
  <meta name="description" content="直近の有価証券報告書から読んだ大株主をグラフで見る。誰が何%持っているか、互いに持ち合っている組が分かる。">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    try {
      var t = localStorage.getItem("yuho-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#detail">銘柄の読みへ</a>
  <header class="top">
    <div class="bar">
      <a class="brandmark" href="./">KABU&nbsp;LAB</a>
      <nav class="servicenav" aria-label="サービス">
        <a href="./" aria-current="page">持合い</a>
        <a href="risk/">リスクの差分</a>
      </nav>
      <form class="search" role="search" id="search-form">
        <label class="sr" for="q">銘柄コードか社名</label>
        <input id="q" type="search" placeholder="銘柄コード・社名で検索" autocomplete="off" spellcheck="false">
        <ul id="suggest" class="suggest" hidden></ul>
      </form>
      <button type="button" id="theme" aria-pressed="false">ダーク</button>
    </div>
  </header>

  <div class="intro">
    <h1>持合い</h1>
    <p id="lede">コードか社名で、誰が何%持っているかを見ます。</p>
  </div>

  <div class="modes">
    <div class="modebar" role="tablist">
      <button type="button" class="mode" data-mode="local" aria-selected="true">この銘柄</button>
      <button type="button" class="mode" data-mode="book" aria-selected="false">有価証券</button>
      <button type="button" class="mode" data-mode="all" aria-selected="false">全体図</button>
    </div>
    <div class="depth" id="depth">
      <button type="button" id="floor" aria-pressed="true">5%以上だけ</button>
      <span>持ち株の筆頭</span>
      <button type="button" data-depth="1" aria-pressed="true">出さない</button>
      <button type="button" data-depth="2" aria-pressed="false">出す</button>
    </div>
  </div>

  <main>
    <aside class="lists" aria-label="銘柄リスト">
      <section>
        <h2 id="list-a">持ち株の多い会社</h2>
        <ol id="hubs"></ol>
      </section>
      <section>
        <h2 id="list-b">持ち分が減った銘柄</h2>
        <ol id="drops"></ol>
      </section>
      <section>
        <h2 id="list-c">互いに持ち合っている組</h2>
        <ol id="pairs"></ol>
      </section>
    </aside>

    <section class="stage" aria-label="株主グラフ">
      <canvas id="graph"></canvas>
      <p id="tip" class="tip" hidden></p>
      <p id="graph-note" class="note"></p>
      <div class="legend" id="legend"></div>
    </section>

    <aside class="detail" id="detail" aria-live="polite">
      <p class="quiet">銘柄を選ぶと、大株主と保有先が出ます。</p>
    </aside>
  </main>

  <footer>
    <p id="foot"></p>
    <p class="footnav"><a href="risk/">事業等のリスクの差分 →</a></p>
  </footer>
  <script src="assets/app.js"></script>
</body>
</html>
