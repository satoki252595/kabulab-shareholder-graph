<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>リスクの差分 — 直近有報の事業等のリスク</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
  <script>
    try {
      var t = localStorage.getItem("yuho-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#detail">読みへ</a>
  <header class="top">
    <div class="bar">
      <h1><a href="./">リスクの差分</a></h1>
      <form class="search" role="search" id="search-form">
        <label class="sr" for="q">銘柄コードか社名</label>
        <input id="q" type="search" placeholder="6662 や ユビテック" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <ul id="suggest" class="suggest" role="listbox" hidden></ul>
      </form>
      <div class="tools">
        <a class="textlink" href="../">持合い</a>
        <button type="button" id="theme" aria-pressed="false">ダーク</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <p class="lede" id="lede">コードか社名で、直前の期と比べた「事業等のリスク」を1枚で見ます。</p>
    <p class="disclaimer" id="disclaimer">投資助言ではない。売買の推奨でもない。金額は有報の文から写したものだけ。</p>

    <nav class="chips" aria-label="読みの種類">
      <button type="button" class="chip" data-list="calendar" aria-pressed="false">取引所の日付</button>
      <button type="button" class="chip" data-list="resolved" aria-pressed="false">解消の判断</button>
      <button type="button" class="chip" data-list="partial" aria-pressed="false">一部だけ良くなった</button>
      <button type="button" class="chip" data-list="prospect" aria-pressed="false">まだ終わっていない</button>
      <button type="button" class="chip" data-list="phrase_gone" aria-pressed="false">語が消えただけ</button>
      <button type="button" class="chip" data-list="gc_affirmed" aria-pressed="false">不確実性を認めている</button>
      <button type="button" class="chip" data-list="accounting" aria-pressed="false">会計の事実</button>
      <button type="button" class="chip" data-list="incomparable" aria-pressed="false">比べられない</button>
    </nav>

    <main>
      <article class="detail" id="detail" aria-live="polite">
        <p class="quiet">一覧か、上の検索から1社を開く。</p>
      </article>
      <aside class="rail" aria-label="短い一覧">
        <section>
          <h2>解消の判断</h2>
          <p class="quiet">買い推奨ではない。</p>
          <ol id="resolved"></ol>
        </section>
        <section>
          <h2>取引所の日付</h2>
          <ol id="calendar"></ol>
        </section>
      </aside>
    </main>

    <footer>
      <p id="foot"></p>
    </footer>
  </div>
  <script src="readings.js"></script>
  <script src="app.js"></script>
</body>
</html>
